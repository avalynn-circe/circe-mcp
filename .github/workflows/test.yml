# Runs on every push and pull request. Type-checks, runs the tests, builds,
# and checks the README and tool descriptions against the standard.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The README passes its own checker
        run: node dist/cli.js check README.md

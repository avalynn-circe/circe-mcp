# Publishes to npm and then to the MCP Registry when a GitHub release is
# published. Both use OIDC, so no token is stored in the repository.
#
# One-time setup, after the first manual publish from a terminal:
#   npmjs.com > circe-mcp > Settings > Trusted publishing > GitHub Actions
#   Owner: avalynn-circe   Repository: circe-mcp   Workflow: publish.yml
#   Environment: leave blank

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test, build, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: The tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "$VERSION" || { echo "tag v$TAG does not match package.json $VERSION"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
      - name: Publish the listing to the MCP Registry
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('server.json','utf8'));const v=require('./package.json').version;s.version=v;s.packages[0].version=v;fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
